name: cachy

x-server-environment: &server-environment
  TIME_ZONE: UTC
  SERVER_READ_TIMEOUT: 1000s
  SERVER_WRITE_TIMEOUT: 1000s
  SERVER_SHUTDOWN_TIMEOUT: 10s
  STORAGE_SHARD_COUNT: "256"
  STORAGE_CLEANUP_INTERVAL: 1s
  STORAGE_CLEANUP_BATCH_SIZE: "1000"
  FEATURES_REPLICATION_BUFFER: "1000"

x-server: &server
  build:
    context: .
    dockerfile: Dockerfile.server
  image: cachy-server:local
  init: true
  restart: unless-stopped
  stop_grace_period: 15s
  environment: *server-environment

services:
  master:
    <<: *server
    environment:
      <<: *server-environment
      REPLICATION_ROLE: master
      SERVER_PORT: "80"
    ports:
      - "${CACHY_MASTER_PORT:-8082}:80"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  slave:
    <<: *server
    environment:
      <<: *server-environment
      REPLICATION_ROLE: slave
      CLIENT_HOST: master
      CLIENT_PORT: "80"
      SERVER_PORT: "80"
    ports:
      - "${CACHY_SLAVE_PORT:-8083}:80"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  client-master:
    profiles: ["clients"]
    build:
      context: .
      dockerfile: Dockerfile.client
    image: cachy-client:local
    init: true
    stdin_open: true
    tty: true
    environment:
      CLIENT_HOST: master
      CLIENT_PORT: "80"
      CLIENT_DIAL_TIMEOUT: 10s
      CLIENT_READ_TIMEOUT: 100s
      CLIENT_WRITE_TIMEOUT: 100s
    depends_on:
      master:
        condition: service_healthy

  client-slave:
    profiles: ["clients"]
    build:
      context: .
      dockerfile: Dockerfile.client
    image: cachy-client:local
    init: true
    stdin_open: true
    tty: true
    environment:
      CLIENT_HOST: slave
      CLIENT_PORT: "80"
      CLIENT_DIAL_TIMEOUT: 10s
      CLIENT_READ_TIMEOUT: 100s
      CLIENT_WRITE_TIMEOUT: 100s
    depends_on:
      slave:
        condition: service_healthy
